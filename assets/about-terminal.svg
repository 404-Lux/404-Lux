<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; }
      
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      
      @keyframes line1 {
        0%, 5% { opacity: 0; }
        10%, 100% { opacity: 1; }
      }
      @keyframes line2 {
        0%, 18% { opacity: 0; }
        24%, 100% { opacity: 1; }
      }
      @keyframes line3 {
        0%, 36% { opacity: 0; }
        42%, 100% { opacity: 1; }
      }
      @keyframes line4 {
        0%, 52% { opacity: 0; }
        58%, 100% { opacity: 1; }
      }
      @keyframes line5 {
        0%, 68% { opacity: 0; }
        74%, 100% { opacity: 1; }
      }
      
      .cursor { animation: blink 0.8s infinite; }
      .l1 { animation: line1 8s infinite; }
      .l2 { animation: line2 8s infinite; }
      .l3 { animation: line3 8s infinite; }
      .l4 { animation: line4 8s infinite; }
      .l5 { animation: line5 8s infinite; }
    </style>
  </defs>

  <!-- Terminal Shell -->
  <rect x="1" y="1" width="538" height="228" rx="10" fill="#231a33" stroke="#341b52" stroke-width="1.5" />
  
  <!-- Titlebar -->
  <path d="M 1 10 Q 1 1 10 1 L 530 1 Q 539 1 539 10 L 539 32 L 1 32 Z" fill="#1d152b" />
  <line x1="1" y1="32" x2="539" y2="32" stroke="#341b52" stroke-width="1" />
  
  <!-- Window Dots -->
  <circle cx="16" cy="16.5" r="4" fill="#f7768e" />
  <circle cx="28" cy="16.5" r="4" fill="#e0af68" />
  <circle cx="40" cy="16.5" r="4" fill="#73daca" />
  <text x="56" y="20.5" fill="#a79cb8" class="mono" font-size="11">lux@cozy-box: ~/about.sh</text>
  <text x="475" y="20.5" fill="#bb9af7" class="mono" font-size="10">[zsh]</text>

  <!-- Terminal Body Content -->
  <!-- Line 1: Command whoami -->
  <g class="mono l1">
    <text x="20" y="58" fill="#ff9e64" font-size="12" font-weight="700">lux@cozy-box:~$</text>
    <text x="145" y="58" fill="#fff3e6" font-size="12">whoami</text>
  </g>

  <!-- Line 2: Output whoami -->
  <g class="mono l2">
    <text x="20" y="80" fill="#bb9af7" font-size="11.5">▸ LUX (404-Lux)</text>
    <text x="145" y="80" fill="#a79cb8" font-size="11.5">| Frontend &amp; Web Developer</text>
  </g>

  <!-- Line 3: Command cat about.txt -->
  <g class="mono l3">
    <text x="20" y="112" fill="#ff9e64" font-size="12" font-weight="700">lux@cozy-box:~$</text>
    <text x="145" y="112" fill="#fff3e6" font-size="12">cat about.txt</text>
  </g>

  <!-- Line 4 & 5: Body text -->
  <g class="mono l4">
    <text x="20" y="136" fill="#fff3e6" font-size="11.5">Building clean, high-performance web interfaces with</text>
    <text x="20" y="156" fill="#ff9e64" font-size="11.5" font-weight="600">HTML, CSS, JavaScript, TypeScript, React &amp; Next.js.</text>
  </g>

  <g class="mono l5">
    <text x="20" y="184" fill="#a79cb8" font-size="11">Headphones on, lo-fi beats playing, cold cola at desk.<tspan fill="#ff9e64" class="cursor">█</tspan></text>
  </g>
</svg>
