<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -5 423 190" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; }

      @keyframes glowStroke {
        0%, 100% { stroke: #341b52; }
        50% { stroke: #bb9af7; }
      }
      .card-shell {
        animation: glowStroke 4.4s ease-in-out infinite 0.5s;
      }
    </style>
  </defs>

  <!-- Shell -->
  <rect x="1" y="1" width="413" height="178" rx="10" fill="#231a33" stroke="#341b52" stroke-width="1.5" class="card-shell" />
  
  <!-- Titlebar -->
  <path d="M 1 10 Q 1 1 10 1 L 405 1 Q 414 1 414 10 L 414 30 L 1 30 Z" fill="#1d152b" />
  <line x1="1" y1="30" x2="414" y2="30" stroke="#341b52" stroke-width="1" />
  
  <circle cx="16" cy="15.5" r="3.5" fill="#f7768e" />
  <circle cx="26" cy="15.5" r="3.5" fill="#e0af68" />
  <circle cx="36" cy="15.5" r="3.5" fill="#73daca" />
  <text x="48" y="19" fill="#a79cb8" class="mono" font-size="10.5">repo: Lauryn-and-Littles</text>
  <text x="350" y="19" fill="#bb9af7" class="mono" font-size="10">[PUBLIC]</text>

  <!-- Project Name -->
  <text x="20" y="58" fill="#bb9af7" class="mono" font-size="15" font-weight="700">Lauryn-and-Littles</text>

  <!-- Project Description -->
  <text x="20" y="82" fill="#fff3e6" class="mono" font-size="11">Charming, responsive web showcase project</text>
  <text x="20" y="100" fill="#a79cb8" class="mono" font-size="11">crafted with semantic markup and tailored styling.</text>

  <!-- Language Chips -->
  <g transform="translate(20, 126)">
    <rect x="0" y="0" width="56" height="20" rx="4" fill="#171024" stroke="#341b52" stroke-width="1" />
    <text x="28" y="13.5" fill="#ff9e64" class="mono" font-size="9.5" text-anchor="middle">HTML5</text>

    <rect x="64" y="0" width="50" height="20" rx="4" fill="#171024" stroke="#341b52" stroke-width="1" />
    <text x="89" y="13.5" fill="#ff9e64" class="mono" font-size="9.5" text-anchor="middle">CSS3</text>

    <rect x="122" y="0" width="85" height="20" rx="4" fill="#171024" stroke="#341b52" stroke-width="1" />
    <text x="164" y="13.5" fill="#ff9e64" class="mono" font-size="9.5" text-anchor="middle">Responsive</text>
  </g>

  <!-- Open Repo Button -->
  <g transform="translate(290, 126)">
    <rect x="0" y="0" width="105" height="22" rx="4" fill="#bb9af7" />
    <text x="52" y="15" fill="#1a1426" class="mono" font-size="10" font-weight="700" text-anchor="middle">OPEN REPO ↗</text>
  </g>
</svg>
