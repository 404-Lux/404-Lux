<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 90" width="100%" height="90">
  <defs>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', Consolas, monospace; }
      .card { fill: #231a33; stroke: #341b52; stroke-width: 1.5; rx: 8px; }
      .card:hover { stroke: #ff9e64; }
    </style>
  </defs>

  <!-- Card 1: Audio Stream -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="206" height="88" class="card" />
    <!-- Headphone Icon -->
    <path d="M 16 28 A 7 7 0 0 1 30 28" stroke="#bb9af7" stroke-width="2" fill="none" />
    <rect x="14" y="27" width="3" height="7" rx="1" fill="#ff9e64" />
    <rect x="29" y="27" width="3" height="7" rx="1" fill="#ff9e64" />
    <text x="40" y="32" fill="#ff9e64" class="mono" font-size="11" font-weight="700">AUDIO_STREAM</text>
    <text x="16" y="58" fill="#fff3e6" class="mono" font-size="12" font-weight="600">Lo-Fi Beats 24/7</text>
    <text x="16" y="74" fill="#a79cb8" class="mono" font-size="9.5">Chill chords &amp; focus</text>
  </g>

  <!-- Card 2: Daily Fuel -->
  <g transform="translate(218, 0)">
    <rect x="0" y="0" width="206" height="88" class="card" />
    <!-- Cola Can Icon -->
    <rect x="16" y="23" width="8" height="13" rx="1.5" fill="#f7768e" />
    <rect x="18" y="27" width="4" height="5" fill="#ff9e64" />
    <text x="34" y="32" fill="#ff9e64" class="mono" font-size="11" font-weight="700">DAILY_FUEL</text>
    <text x="16" y="58" fill="#fff3e6" class="mono" font-size="12" font-weight="600">Cold Coca-Cola</text>
    <text x="16" y="74" fill="#a79cb8" class="mono" font-size="9.5">100% chilled caffeine</text>
  </g>

  <!-- Card 3: Core Stack -->
  <g transform="translate(436, 0)">
    <rect x="0" y="0" width="206" height="88" class="card" />
    <!-- Terminal Prompt Icon -->
    <rect x="15" y="23" width="13" height="12" rx="2" fill="#1a1426" stroke="#341b52" stroke-width="1" />
    <path d="M 17 28 L 19 30 L 17 32" stroke="#ff9e64" stroke-width="1" fill="none" />
    <text x="36" y="32" fill="#ff9e64" class="mono" font-size="11" font-weight="700">CORE_STACK</text>
    <text x="16" y="58" fill="#fff3e6" class="mono" font-size="12" font-weight="600">React • Next • TS</text>
    <text x="16" y="74" fill="#a79cb8" class="mono" font-size="9.5">Modern web frontend</text>
  </g>

  <!-- Card 4: Mascot Vibe -->
  <g transform="translate(654, 0)">
    <rect x="0" y="0" width="206" height="88" class="card" />
    <!-- Cat Face Icon -->
    <polygon points="15,28 17,23 20,27" fill="#ff9e64" />
    <polygon points="23,27 26,23 28,28" fill="#ff9e64" />
    <rect x="15" y="27" width="13" height="9" rx="2" fill="#ff9e64" />
    <circle cx="18" cy="30" r="1" fill="#1a1426" />
    <circle cx="25" cy="30" r="1" fill="#1a1426" />
    <text x="36" y="32" fill="#ff9e64" class="mono" font-size="11" font-weight="700">MASCOT_VIBE</text>
    <text x="16" y="58" fill="#fff3e6" class="mono" font-size="12" font-weight="600">Orange Cat + Beats</text>
    <text x="16" y="74" fill="#a79cb8" class="mono" font-size="9.5">Curious &amp; cozy tabby</text>
  </g>
</svg>
