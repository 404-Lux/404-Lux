    <text x="16" y="94" fill="#fff3e6" class="mono" font-size="11" font-weight="600">VS Code Environment</text>
    <text x="228" y="94" fill="#a79cb8" class="mono" font-size="9.5">95%</text>
    <rect x="16" y="100" width="244" height="6" rx="3" fill="#150f21" />
    <rect x="16" y="100" width="232" height="6" rx="3" fill="#ff9e64" class="p-bar" />

    <!-- Item 3: Terminal Scripting -->
    <text x="16" y="134" fill="#fff3e6" class="mono" font-size="11" font-weight="600">Zsh / Shell</text>
    <text x="228" y="134" fill="#a79cb8" class="mono" font-size="9.5">85%</text>
    <rect x="16" y="140" width="244" height="6" rx="3" fill="#150f21" />
