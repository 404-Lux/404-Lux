    <text x="228" y="134" fill="#a79cb8" class="mono" font-size="9.5">90%</text>
    <rect x="16" y="140" width="244" height="6" rx="3" fill="#150f21" />
    <rect x="16" y="140" width="220" height="6" rx="3" fill="#ff9e64" class="p-bar" />

    <!-- Item 4: Responsive UI -->
    <text x="16" y="174" fill="#fff3e6" class="mono" font-size="11" font-weight="600">Mobile-First UI</text>
    <text x="228" y="174" fill="#a79cb8" class="mono" font-size="9.5">92%</text>
    <rect x="16" y="180" width="244" height="6" rx="3" fill="#150f21" />
    <rect x="16" y="180" width="225" height="6" rx="3" fill="#bb9af7" class="p-bar" />
  </g>

