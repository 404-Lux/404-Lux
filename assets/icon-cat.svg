  <rect x="9" y="15" width="2" height="1" fill="#1a1426" />
  <rect x="13" y="15" width="2" height="1" fill="#1a1426" />
  <!-- Whisker Accents -->
  <rect x="1" y="12" width="2" height="1" fill="#bb9af7" />
  <rect x="1" y="15" width="2" height="1" fill="#bb9af7" />
  <rect x="21" y="12" width="2" height="1" fill="#bb9af7" />
  <rect x="21" y="15" width="2" height="1" fill="#bb9af7" />
</svg>
