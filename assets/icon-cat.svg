<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none">
  <!-- Ears -->
  <rect x="3" y="3" width="3" height="4" fill="#ff9e64" />
  <rect x="4" y="2" width="2" height="2" fill="#ff9e64" />
  <rect x="18" y="3" width="3" height="4" fill="#ff9e64" />
  <rect x="18" y="2" width="2" height="2" fill="#ff9e64" />
  <!-- Head Base -->
  <rect x="3" y="7" width="18" height="13" fill="#ff9e64" rx="1" />
  <!-- Inner Ears -->
  <rect x="5" y="4" width="2" height="2" fill="#341b52" />
  <rect x="17" y="4" width="2" height="2" fill="#341b52" />
  <!-- Eyes -->
  <rect x="6" y="11" width="3" height="2" fill="#1a1426" />
  <rect x="15" y="11" width="3" height="2" fill="#1a1426" />
  <!-- Snout / Cheeks -->
